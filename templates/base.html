<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema DU-E</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><div class="header-inner"><a class="brand" href="{{ url_for('index') }}" aria-label="DU-E Control"><img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="DU-E Control"></a><nav class="main-nav" aria-label="Navegação principal">
<a class="nav-link{{ ' is-active' if request.path == url_for('index') else '' }}" href="{{ url_for('index') }}"{% if request.path == url_for('index') %} aria-current="page"{% endif %}>Dashboard</a>
<a class="nav-link{{ ' is-active' if request.path.startswith('/invoice') else '' }}" href="{{ url_for('lista_invoices') }}"{% if request.path.startswith('/invoice') %} aria-current="page"{% endif %}>Gestão de Invoices</a>
<a class="nav-link{{ ' is-active' if request.path.startswith('/due') else '' }}" href="{{ url_for('consulta_dues') }}"{% if request.path.startswith('/due') %} aria-current="page"{% endif %}>Gestão de DU-Es</a>
<a class="nav-link{{ ' is-active' if request.path.startswith('/contrat') else '' }}" href="{{ url_for('lista_contratos') }}"{% if request.path.startswith('/contrat') %} aria-current="page"{% endif %}>Gestão de Contratos de Câmbio</a>
<a class="nav-link{{ ' is-active' if request.path.startswith('/derivativ') or request.path.startswith('/ndf') else '' }}" href="{{ url_for('dashboard_derivativos') }}"{% if request.path.startswith('/derivativ') or request.path.startswith('/ndf') %} aria-current="page"{% endif %}>Gestão de Derivativos</a>
<a class="nav-link{{ ' is-active' if request.path.startswith('/configuracoes') else '' }}" href="{{ url_for('configuracoes') }}"{% if request.path.startswith('/configuracoes') %} aria-current="page"{% endif %}>Configurações</a>
</nav></div></header><main><div id="copy-toast" class="copy-toast" data-copy-toast role="status" aria-live="polite">Copiado!</div>
{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}
<div class="flash {{cat}}">{{ msg }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
