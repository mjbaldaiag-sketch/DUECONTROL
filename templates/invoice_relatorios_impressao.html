<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ table.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="print-report invoice-report-print">
  <div class="report-actions">
    <button class="btn" type="button" onclick="window.print()">Imprimir / Salvar PDF</button>
    <a class="btn secondary" href="{{ url_for('relatorios_invoices') }}">Voltar ao relatório</a>
  </div>

  <div class="invoice-report-print-title">{{ table.title }}</div>

  <div class="report-details invoice-report-detail invoice-report-detail--print">
    {% include "_invoice_report_detail.html" %}
  </div>
</main>
</body>
</html>
