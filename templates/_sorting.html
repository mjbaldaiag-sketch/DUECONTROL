{% macro sortable_header(label, key, sort, direction, sort_links, sort_type=None, currency_code=None) -%}
<th class="sortable-server-header" aria-sort="{{ 'ascending' if sort == key and direction == 'ASC' else 'descending' if sort == key else 'none' }}"{% if sort_type %} data-sort-type="{{ sort_type }}"{% endif %}><a href="{{ url_for(request.endpoint, **sort_links[key]) }}">{% if label %}{{ label }}{% if currency_code %} {% endif %}{% endif %}{% if currency_code %}<span class="currency-badge {{ currency_code|currency_class }}">{{ currency_code }}</span>{% endif %}</a></th>
{%- endmacro %}
