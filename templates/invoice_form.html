{% extends "base.html" %}
{% block content %}
<div class="page-heading"><div><h1>{{ 'Editar' if invoice else 'Nova' }} Invoice</h1><p class="muted">A Invoice é a fonte primária do fluxo financeiro.</p></div><a class="btn secondary" href="{{ url_for('detalhe_invoice', invoice_id=invoice.id) if invoice else url_for('lista_invoices') }}">Voltar</a></div>
<form method="post" class="form">
  <label>Status*<select name="status" data-invoice-status-select required>{% for status, label in invoice_statuses.items() %}<option value="{{ status }}" {{ 'selected' if invoice and invoice.status == status else '' }}>{{ label }}</option>{% endfor %}</select><input type="hidden" name="data_credito" data-invoice-credit-date value="{{ invoice.data_credito if invoice and invoice.data_credito else '' }}"><small class="muted">O status informado manualmente permanece mesmo após novos recebimentos ou vínculos de câmbio.</small></label>
  <label>Empresa*<select name="empresa_id" data-invoice-company-select required><option value="">Selecione uma empresa</option>{% for empresa in empresas %}{% set padrao_empresa = padroes_por_empresa.get(empresa.id) %}<option value="{{ empresa.id }}" data-default-banco-referenciado="{{ padrao_empresa.banco_referenciado_id if padrao_empresa else '' }}" {{ 'selected' if invoice and invoice.empresa_id == empresa.id else '' }}>{{ empresa.apelido or empresa.razao_social }} — {{ empresa.cnpj|cnpj }}</option>{% endfor %}</select></label>
  <label>Número da Invoice*<input name="numero_invoice" value="{{ invoice.numero_invoice if invoice else '' }}" required></label>
  <label>Contrato comercial<input name="contrato_comercial" maxlength="120" value="{{ invoice.contrato_comercial if invoice else '' }}" placeholder="Referência comercial da Invoice"><small class="muted">Opcional; não altera o câmbio nem os saldos.</small></label>
  <label>Tipo documental*<select name="tipo_documento" required><option value="">Selecione</option>{% for tipo in invoice_types %}<option value="{{ tipo }}" {{ 'selected' if invoice and invoice.tipo_documento == tipo else '' }}>{{ tipo|invoice_type_label }}</option>{% endfor %}</select></label>
  <label>Competência*<select name="competencia_id" data-competencia-select required><option value="">Selecione uma competência</option>{% for competencia in competencias %}<option value="{{ competencia.id }}" data-competencia-empresa="{{ competencia.empresa_id }}" {{ 'selected' if invoice and invoice.competencia_id == competencia.id else '' }}>{{ competencia.descricao }} — {{ competencia.empresa_apelido or competencia.razao_social }} ({{ competencia.data_inicial|date_br }} a {{ competencia.data_final|date_br }})</option>{% endfor %}</select><small class="muted">Após selecionar a empresa, somente suas competências ficam disponíveis.</small></label>
  <label>Cliente<select name="cliente_id"><option value="">Nenhum cliente selecionado</option>{% for cliente in clientes %}<option value="{{ cliente.id }}" {{ 'selected' if invoice and invoice.cliente_id == cliente.id else '' }}>{{ cliente.nome }} — {{ cliente.pais|pais_nome }}</option>{% endfor %}</select></label>
  <label>Banco Referenciado<select name="banco_referenciado_id" data-invoice-default-bank><option value="">Nenhum banco selecionado</option>{% for banco in contrapartes %}<option value="{{ banco.id }}" {{ 'selected' if banco_referenciado_id == banco.id else '' }}>{{ banco.nome }}</option>{% endfor %}</select><small class="muted">Será usado como sugestão no próximo recebimento.</small></label>
  <label>Data de emissão<input name="data_emissao" data-date-br placeholder="dd/mm/aaaa" value="{{ invoice.data_emissao|date_br if invoice else '' }}"></label>
  <label>Moeda*<input name="moeda" maxlength="3" value="{{ invoice.moeda if invoice else 'USD' }}" required></label>
  <label>Valor na moeda*<input name="valor_moeda" data-money inputmode="decimal" value="{{ invoice.valor_moeda|money if invoice else '' }}" required></label>
  <label>Observação<textarea name="observacao">{{ invoice.observacao if invoice else '' }}</textarea></label>
  <div class="form-actions"><button>{{ 'Salvar alterações' if invoice else 'Cadastrar Invoice' }}</button><a class="btn secondary" href="{{ url_for('lista_invoices') }}">Cancelar</a></div>
</form>
 <dialog data-invoice-status-dialog aria-labelledby="invoice-status-dialog-title"><form method="dialog" data-invoice-status-dialog-form><h2 id="invoice-status-dialog-title">Data do crédito</h2><p>Informe a data em que o crédito foi recebido para concluir a alteração do status.</p><label>Data do crédito*<input type="date" data-invoice-status-dialog-date required></label><div class="form-actions"><button type="submit">Confirmar</button><button type="button" class="btn secondary" data-invoice-status-cancel>Cancelar</button></div></form></dialog>
{% endblock %}
